<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoachPulse · Présences</title>
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    :root{
      --green:#00843d;
      --dark:#005d2b;
      --gold:#c8a44d;
      --soft:#f3f5f4;
      --text:#10251b;
      --line:#dde5e1;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:var(--soft);
    }
    main{
      width:100%;
      max-width:none;
      margin:0;
      padding:0 10px 24px;
    }
    .presence-tabs{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      width:calc(100% + 20px);
      margin:0 -10px 18px;
      padding:8px 10px;
      background:linear-gradient(90deg,#006f3c 0%,#005d2b 64%,#004522 100%);
      border-bottom:4px solid var(--gold);
      box-shadow:0 12px 26px rgba(0,75,40,.20);
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }
    .presence-tab{
      display:flex;
      flex:0 0 auto;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      min-width:86px;
      min-height:48px;
      padding:7px 10px;
      border:1px solid rgba(255,255,255,.34);
      border-radius:11px;
      background:#fff;
      color:var(--dark);
      text-transform:uppercase;
      font-size:9.5px;
      font-weight:1000;
      line-height:1.08;
      text-align:center;
    }
    .presence-tab span{
      display:block;
      font-size:19px;
      line-height:1;
    }
    .presence-tab small{
      display:block;
      font-size:8.5px;
      font-weight:1000;
      line-height:1.05;
      opacity:.82;
      text-transform:none;
    }
    .presence-tab.active{
      background:linear-gradient(135deg,#f3dc8c,#c8a44d);
      color:#123c2a;
      border-color:#8e6f20;
      box-shadow:inset 0 0 0 2px rgba(142,111,32,.18);
    }
    .presence-placeholder{
      max-width:980px;
      margin:40px auto 0;
      padding:28px;
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      box-shadow:0 14px 34px rgba(16,37,27,.08);
    }
    .presence-placeholder h1{
      margin:0 0 10px;
      color:var(--dark);
      font-size:clamp(28px,4vw,44px);
      line-height:1;
    }
    .presence-placeholder p{
      margin:0;
      color:#66756d;
      font-weight:800;
      font-size:clamp(15px,2vw,18px);
      line-height:1.45;
    }
    @media(max-width:760px){
      main{padding:0 8px 18px}
      .presence-tabs{
        width:calc(100% + 16px);
        margin:0 -8px 14px;
        padding:7px;
        gap:7px;
      }
      .presence-tab{
        min-width:76px;
        min-height:45px;
        padding:6px 8px;
        font-size:8.5px;
      }
      .presence-tab span{font-size:17px}
    }
  </style>
</head>
<body>
  <main>
    <nav class="presence-tabs" aria-label="Navigation Présences">
      <button class="presence-tab active" type="button"><span>🏠</span>Tableau de bord<small>Vue globale</small></button>
      <button class="presence-tab" type="button"><span>✅</span>Séances<small>Présences</small></button>
      <button class="presence-tab" type="button"><span>📅</span>Calendrier<small>Planning</small></button>
      <button class="presence-tab" type="button"><span>📊</span>Bilans<small>Suivi collectif</small></button>
      <button class="presence-tab" type="button"><span>⚡</span>Prévention<small>Charge</small></button>
      <button class="presence-tab" type="button"><span>🧩</span>Paramètres<small>Réglages</small></button>
    </nav>
    <section class="presence-placeholder" aria-labelledby="presenceTitle">
      <h1 id="presenceTitle">Module Présences mis en pause</h1>
      <p>Le bandeau est conservé. La création, la sauvegarde, les imports, les bilans et la synchronisation des séances ont été retirés pour repartir sur une base saine.</p>
    </section>
  </main>
</body>
</html>
