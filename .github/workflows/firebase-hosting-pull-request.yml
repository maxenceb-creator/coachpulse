name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Firebase credentials
        run: |
          cat > "$HOME/firebase-service-account.json" <<'SERVICE_ACCOUNT'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COACH_PULSE_EE6B0 }}
          SERVICE_ACCOUNT
      - name: Deploy PR preview channel
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-service-account.json
        run: |
          set +e
          channel="pr-${{ github.event.pull_request.number }}"
          npx firebase-tools@latest hosting:channel:deploy "$channel" --project coach-pulse-ee6b0 --non-interactive --expires 7d 2>&1 | tee "$RUNNER_TEMP/firebase-pr-deploy.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -q "is the current active version" "$RUNNER_TEMP/firebase-pr-deploy.log"; then
            echo "Firebase PR channel is already on this version. Treating as success."
            exit 0
          fi
          exit "$status"
