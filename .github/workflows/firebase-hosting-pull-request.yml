name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate CoachPulse
        run: npm run check
      - name: Validate Firestore access rules
        run: npm run test:rules
      - name: Prepare Firebase credentials
        run: |
          cat > "$HOME/firebase-service-account.json" <<'SERVICE_ACCOUNT'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COACH_PULSE_EE6B0 }}
          SERVICE_ACCOUNT
      - name: Verify active Firestore Rules fingerprint
        id: rules_fingerprint
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: coach-pulse-ee6b0
        run: node scripts/verify-active-firestore-rules.cjs firestore.rules
      - name: Build public assets
        id: build_public
        run: npm run build:public
      - name: Deploy PR preview channel
        id: deploy_preview
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-service-account.json
        run: |
          set +e
          channel="pr-${{ github.event.pull_request.number }}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          npx firebase-tools@latest hosting:channel:deploy "$channel" --project coach-pulse-ee6b0 --non-interactive --expires 7d 2>&1 | tee "$RUNNER_TEMP/firebase-pr-deploy.log"
          status=${PIPESTATUS[0]}
          preview_url="$(sed -nE 's/.*Channel URL[^:]*: (https:\/\/[^[:space:]()]+).*/\1/p' "$RUNNER_TEMP/firebase-pr-deploy.log" | tail -n 1 | sed 's/[),.]$//')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "deploy_note=Firebase Hosting preview channel deployed." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "is the current active version" "$RUNNER_TEMP/firebase-pr-deploy.log"; then
            echo "Firebase PR channel is already on this version. Treating as success."
            echo "deploy_note=Firebase Hosting preview channel is already on this version." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qi "channel quota reached" "$RUNNER_TEMP/firebase-pr-deploy.log"; then
            echo "::warning::Firebase Hosting preview channel quota reached. Validation and build passed, preview deploy skipped. Delete old preview channels in Firebase Hosting."
            echo "deploy_note=Firebase Hosting preview channel quota reached. Validation and build passed, preview deploy skipped." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"
      - name: Publish preview summary
        if: always()
        env:
          RULES_MATCH: ${{ steps.rules_fingerprint.outputs.match }}
          EXPECTED_RULES_SHA256: ${{ steps.rules_fingerprint.outputs.expected_sha256 }}
          ACTIVE_RULES_SHA256: ${{ steps.rules_fingerprint.outputs.active_sha256 }}
          ACTIVE_RULESET: ${{ steps.rules_fingerprint.outputs.ruleset }}
          BUILD_OUTCOME: ${{ steps.build_public.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_preview.outcome }}
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.preview_url }}
          PREVIEW_CHANNEL: ${{ steps.deploy_preview.outputs.channel }}
          DEPLOY_NOTE: ${{ steps.deploy_preview.outputs.deploy_note }}
        run: |
          {
            echo "## CoachPulse Firebase Preview"
            echo
            if [ -n "$PREVIEW_URL" ]; then
              echo "- Channel: \`$PREVIEW_CHANNEL\`"
              echo "- Lien de test: $PREVIEW_URL"
            elif [ "$RULES_MATCH" != "true" ]; then
              echo "⚠️ Preview non publiée : les validations ont réussi, mais les Rules actives ne correspondent pas aux Rules attendues par cette PR. Build et Hosting Preview non exécutés."
              echo "- Empreinte attendue: \`$EXPECTED_RULES_SHA256\`"
              echo "- Empreinte active: \`$ACTIVE_RULES_SHA256\`"
              echo "- Ruleset actif: \`$ACTIVE_RULESET\`"
            elif [ "$BUILD_OUTCOME" = "success" ]; then
              echo "⚠️ Build réussi, mais Preview Firebase non publiée."
              echo "- État du déploiement: \`$DEPLOY_OUTCOME\`"
              echo "- Note: ${DEPLOY_NOTE:-le déploiement preview n'a pas renvoyé d'URL.}"
            else
              echo "⚠️ Preview Firebase non publiée : les validations ou le build ont échoué."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment PR with preview link
        if: always()
        uses: actions/github-script@v7
        env:
          RULES_MATCH: ${{ steps.rules_fingerprint.outputs.match }}
          EXPECTED_RULES_SHA256: ${{ steps.rules_fingerprint.outputs.expected_sha256 }}
          ACTIVE_RULES_SHA256: ${{ steps.rules_fingerprint.outputs.active_sha256 }}
          ACTIVE_RULESET: ${{ steps.rules_fingerprint.outputs.ruleset }}
          BUILD_OUTCOME: ${{ steps.build_public.outcome }}
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.preview_url }}
          PREVIEW_CHANNEL: ${{ steps.deploy_preview.outputs.channel }}
          DEPLOY_NOTE: ${{ steps.deploy_preview.outputs.deploy_note }}
        with:
          script: |
            const marker = '<!-- coachpulse-firebase-preview -->';
            const channel = process.env.PREVIEW_CHANNEL || `pr-${context.payload.pull_request.number}`;
            const previewUrl = process.env.PREVIEW_URL || '';
            const note = process.env.DEPLOY_NOTE || "Le deploiement preview n'a pas renvoye d'URL.";
            let body;
            if (previewUrl) {
              body = `${marker}\n${previewUrl}`;
            } else if (process.env.RULES_MATCH !== 'true') {
              body = `${marker}\n⚠️ Preview non publiée : les validations ont réussi, mais les Rules actives ne correspondent pas aux Rules attendues par cette PR. Build et Hosting Preview non exécutés.\n\n- Empreinte attendue: \`${process.env.EXPECTED_RULES_SHA256}\`\n- Empreinte active: \`${process.env.ACTIVE_RULES_SHA256}\`\n- Ruleset actif: \`${process.env.ACTIVE_RULESET}\``;
            } else if (process.env.BUILD_OUTCOME === 'success') {
              body = `${marker}\n⚠️ Build réussi, mais Preview Firebase non publiée.\n\n${note}`;
            } else {
              body = `${marker}\n⚠️ Preview Firebase non publiée : les validations ou le build ont échoué.`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
