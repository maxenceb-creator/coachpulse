name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CoachPulse
        run: npm run check
      - name: Build public assets
        run: npm run build:public
      - name: Prepare Firebase credentials
        run: |
          cat > "$HOME/firebase-service-account.json" <<'SERVICE_ACCOUNT'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COACH_PULSE_EE6B0 }}
          SERVICE_ACCOUNT
      - name: Deploy PR preview channel
        id: deploy_preview
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-service-account.json
        run: |
          set +e
          channel="pr-${{ github.event.pull_request.number }}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          npx firebase-tools@latest hosting:channel:deploy "$channel" --project coach-pulse-ee6b0 --non-interactive --expires 7d 2>&1 | tee "$RUNNER_TEMP/firebase-pr-deploy.log"
          status=${PIPESTATUS[0]}
          preview_url="$(grep -Eo 'https://[^[:space:]()]+' "$RUNNER_TEMP/firebase-pr-deploy.log" | grep -E 'web\.app|firebaseapp\.com' | head -n 1 | sed 's/[),.]$//')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "deploy_note=Firebase Hosting preview channel deployed." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "is the current active version" "$RUNNER_TEMP/firebase-pr-deploy.log"; then
            echo "Firebase PR channel is already on this version. Treating as success."
            echo "deploy_note=Firebase Hosting preview channel is already on this version." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qi "channel quota reached" "$RUNNER_TEMP/firebase-pr-deploy.log"; then
            echo "::warning::Firebase Hosting preview channel quota reached. Validation and build passed, preview deploy skipped. Delete old preview channels in Firebase Hosting."
            echo "deploy_note=Firebase Hosting preview channel quota reached. Validation and build passed, preview deploy skipped." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"
      - name: Publish preview summary
        if: always()
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.preview_url }}
          PREVIEW_CHANNEL: ${{ steps.deploy_preview.outputs.channel }}
          DEPLOY_NOTE: ${{ steps.deploy_preview.outputs.deploy_note }}
        run: |
          {
            echo "## CoachPulse Firebase Preview"
            echo
            if [ -n "$PREVIEW_URL" ]; then
              echo "- Channel: \`$PREVIEW_CHANNEL\`"
              echo "- Lien de test: $PREVIEW_URL"
            else
              echo "- Channel: \`$PREVIEW_CHANNEL\`"
              echo "- Aucun lien preview disponible."
              echo "- Note: ${DEPLOY_NOTE:-le déploiement preview n'a pas renvoyé d'URL.}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment PR with preview link
        if: always()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.preview_url }}
          PREVIEW_CHANNEL: ${{ steps.deploy_preview.outputs.channel }}
          DEPLOY_NOTE: ${{ steps.deploy_preview.outputs.deploy_note }}
        with:
          script: |
            const marker = '<!-- coachpulse-firebase-preview -->';
            const channel = process.env.PREVIEW_CHANNEL || `pr-${context.payload.pull_request.number}`;
            const previewUrl = process.env.PREVIEW_URL || '';
            const note = process.env.DEPLOY_NOTE || "Le deploiement preview n'a pas renvoye d'URL.";
            const body = previewUrl
              ? `${marker}\n✅ **Lien de test CoachPulse**\n\n[Ouvrir la preview Firebase](${previewUrl})\n\nChannel: \`${channel}\`\n\nCe lien est mis a jour automatiquement a chaque push sur cette PR.`
              : `${marker}\n⚠️ **Preview Firebase non disponible**\n\nChannel: \`${channel}\`\n\n${note}\n\nLes validations et le build ont tout de meme ete executes dans le check.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
