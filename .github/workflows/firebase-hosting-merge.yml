name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COACH_PULSE_EE6B0 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Check active Firestore Rules fingerprint
        id: rules_fingerprint
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: coach-pulse-ee6b0
        run: node scripts/verify-active-firestore-rules.cjs firestore.rules --allow-mismatch
      - name: Deploy Firestore rules when required
        if: steps.rules_fingerprint.outputs.match == 'false'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: coach-pulse-ee6b0
        run: |
          max_attempts=3
          attempt=1
          while true; do
            set +e
            npx firebase-tools@latest deploy --only firestore:rules --project coach-pulse-ee6b0 --non-interactive 2>&1 | tee "${RUNNER_TEMP}/firebase-rules-${attempt}.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if grep -Eq 'HTTP Error: 409([^0-9]|$)' "${RUNNER_TEMP}/firebase-rules-${attempt}.log"; then
              echo "HTTP 409 reçu. Vérification stricte des Rules actives avant toute poursuite."
              node scripts/verify-active-firestore-rules.cjs firestore.rules
              break
            fi
            if ! grep -Eq 'HTTP Error: (429|500|502|503|504)([^0-9]|$)' "${RUNNER_TEMP}/firebase-rules-${attempt}.log"; then
              exit "$status"
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              exit "$status"
            fi
            sleep_seconds=$((attempt * 10))
            echo "Firebase Rules indisponible temporairement. Nouvelle tentative dans ${sleep_seconds}s (${attempt}/${max_attempts})."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done
      - name: Verify deployed Firestore Rules fingerprint
        if: steps.rules_fingerprint.outputs.match == 'false'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: coach-pulse-ee6b0
        run: node scripts/verify-active-firestore-rules.cjs firestore.rules
      - name: Deploy Firebase Hosting
        if: success()
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COACH_PULSE_EE6B0 }}
          channelId: live
          projectId: coach-pulse-ee6b0
