name: Deploy production Hosting only
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-hosting
  cancel-in-progress: false

jobs:
  validate_and_deploy_hosting:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate CoachPulse
        run: npm run check
      - name: Validate match workflows
        run: npm run test:match
      - name: Validate Firestore access rules
        run: npm run test:rules
      - name: Build public assets
        run: npm run build:public
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COACH_PULSE_EE6B0 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Verify active compatibility Rules fingerprint
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: coach-pulse-ee6b0
        run: node scripts/verify-active-firestore-rules.cjs --expected-sha256-file firestore.compat.sha256
      - name: Deploy Firebase Hosting only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COACH_PULSE_EE6B0 }}
          channelId: live
          projectId: coach-pulse-ee6b0
