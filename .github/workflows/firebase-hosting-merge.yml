name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COACH_PULSE_EE6B0 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          max_attempts=3
          attempt=1
          while true; do
            set +e
            npx firebase-tools@latest deploy --only firestore:rules --project coach-pulse-ee6b0 --non-interactive 2>&1 | tee "${RUNNER_TEMP}/firebase-rules-${attempt}.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if ! grep -Eq 'HTTP Error: (429|500|502|503|504)([^0-9]|$)' "${RUNNER_TEMP}/firebase-rules-${attempt}.log"; then
              exit "$status"
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              exit "$status"
            fi
            sleep_seconds=$((attempt * 10))
            echo "Firebase Rules indisponible temporairement. Nouvelle tentative dans ${sleep_seconds}s (${attempt}/${max_attempts})."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COACH_PULSE_EE6B0 }}
          channelId: live
          projectId: coach-pulse-ee6b0
